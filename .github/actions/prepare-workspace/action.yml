name: Prepare workspace
description: Node, pnpm and the workspace dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # There is deliberately no nx cache here, and restoring one is futile: nx 20
    # replaced the file-system cache with a database keyed by the machine ID —
    # `/etc/machine-id` on Linux, which every hosted runner generates fresh. A
    # restored `.nx/cache` is artifacts nx has no metadata for, so it warns
    # "Unrecognized Cache Artifacts" and rebuilds everything; a restored
    # `.nx/workspace-data` is a database under a filename nx never opens. The
    # old escape hatches are gone too — `DbCache` ignores
    # NX_REJECT_UNKNOWN_LOCAL_CACHE, and `useLegacyCache` no longer exists.
    #
    # This cost 4s a job to download 15MB and then miss every task. Sharing
    # build results across runners needs a remote cache (Nx Cloud, or nx's
    # self-hosted cache API); until there is one, every job pays its own
    # `^build`.
