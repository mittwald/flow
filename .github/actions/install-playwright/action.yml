name: Install a Playwright browser
description:
  Installs one Playwright browser and the system libraries it needs, both from
  cache when possible.

inputs:
  browser:
    description: The Playwright browser to install.
    default: webkit

runs:
  using: composite
  steps:
    # Browser builds and .debs differ per Ubuntu release, so both caches are
    # keyed on it: `ubuntu-latest` moves from 24.04 to 26.04.
    - name: Read the OS release
      id: os
      shell: bash
      run: |
        . /etc/os-release
        echo "release=$ID$VERSION_ID" >> "$GITHUB_OUTPUT"

    # One key per browser, and apart from the visual workflows' cache, which
    # holds both browsers: under one shared key whichever job saved first would
    # decide what the others find.
    - name: Cache the Playwright browser
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key:
          playwright-${{ inputs.browser }}-${{ steps.os.outputs.release }}-${{
          hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ inputs.browser }}-${{ steps.os.outputs.release }}-

    # `--with-deps` downloads ~120 MB of .debs on every job, and a slow Ubuntu
    # mirror can stretch that past the job timeout. Restored, apt finds them in
    # its archive and downloads nothing.
    #
    # The key never matches outright: its prefix restores the newest entry.
    - name: Restore the system packages
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/playwright-debs
        key:
          playwright-${{ inputs.browser }}-debs-${{ steps.os.outputs.release }}-

    # apt reuses a .deb in its archive when name, version and checksum match,
    # and downloads only the rest — fetch-debs.sh fetches those first, bounded.
    # `autoclean` drops versions the mirror no longer offers, so updated
    # packages replace their old .debs in the cache.
    - name: Install the Playwright browser
      id: install
      shell: bash
      run: |
        debs=~/.cache/playwright-debs
        mkdir -p "$debs"
        sudo find "$debs" -name '*.deb' -exec cp -t /var/cache/apt/archives {} +
        "${{ github.action_path }}/fetch-debs.sh" ${{ inputs.browser }}
        pnpm exec playwright install --with-deps ${{ inputs.browser }}
        sudo apt-get autoclean -qq
        rm -f "$debs"/*.deb
        find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$debs" {} +
        echo "key=playwright-${{ inputs.browser }}-debs-${{ steps.os.outputs.release }}-$(ls "$debs" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # Saves only a package set the cache does not hold yet.
    - name: Save the system packages
      if: steps.install.outputs.key != steps.restore.outputs.cache-matched-key
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/playwright-debs
        key: ${{ steps.install.outputs.key }}
