name: Build & Deploy main to mittwald

on:
  push:
    branches:
      - main
  # `publish.yml` dispatches this after it created a GitHub Release that no push
  # to `main` follows — a pre-graduated promotion (RFC #2711). The docs bake the
  # GitHub Releases list in at build time (`output: "export"`), so without a
  # rebuild `/releases` keeps showing the release before the promotion. Also the
  # manual handle for any other "the deployed site is stale" case.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: docs
            context: apps/docs
            image_suffix: docs
          - app: storybook
            context: packages/components
            image_suffix: storybook

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v6

      - uses: ./.github/actions/prepare-workspace

      # The Styleguide renders FontAwesome Pro icons, fetched with the license
      # token outside the lockfile (apps/docs/dev/installProIcons.ts). Its own
      # step keeps the token out of the build's environment. No fallback here:
      # production fails rather than ship the default icons.
      - name: Install the FontAwesome Pro icons
        if: matrix.image_suffix == 'docs'
        run: pnpm --filter @mittwald/flow-documentation install:pro-icons
        env:
          FONT_AWESOME_PACKAGE_TOKEN: ${{ secrets.FONT_AWESOME_PACKAGE_TOKEN }}
          FLOW_DOCS_REQUIRE_PRO_ICONS: "1"

      # The image used to build this itself, which meant a second toolchain
      # install and the whole dependency chain rebuilt inside the image — 80 of
      # the 449 seconds a docs preview took. Here the runner builds that chain
      # and the image only packages what comes out.
      #
      # NEXT_BASE_PATH was a build-arg for the same reason; the value is the one
      # the Dockerfile passed.
      - name: Build the docs
        if: matrix.image_suffix == 'docs'
        run: pnpm nx build docs
        env:
          NEXT_BASE_PATH: ""

      - name: Check the docs carry no FontAwesome token
        if: matrix.image_suffix == 'docs'
        run: |
          if grep -rqF "$FONT_AWESOME_PACKAGE_TOKEN" apps/docs/out; then
            echo "::error::apps/docs/out contains the FontAwesome package token"
            exit 1
          fi
        env:
          FONT_AWESOME_PACKAGE_TOKEN: ${{ secrets.FONT_AWESOME_PACKAGE_TOKEN }}

      # No Next.js build cache is saved here, although it would seed the
      # previews: Turbopack's persistent cache holds the FontAwesome Pro modules,
      # and every PR — a fork's included — can restore a cache from `main`,
      # under any key it likes, and upload it.

      # Two commands because `build:storybook` declares no nx dependency on the
      # components build — the same pair the Dockerfile ran.
      - name: Build Storybook
        if: matrix.image_suffix == 'storybook'
        run: |
          pnpm nx build components
          pnpm nx build:storybook components

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docs
        id: meta-docs
        if: matrix.image_suffix == 'docs'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images:
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest
            type=sha

      - name: Extract metadata for Storybook
        id: meta-storybook
        if: matrix.image_suffix == 'storybook'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images:
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The built output and the server config beside it, nothing else — see
          # the context's own .dockerignore.
          context: ${{ matrix.context }}
          push: true
          provenance: false # single-manifest image (as before v7)
          tags:
            ${{ matrix.image_suffix == 'docs' && steps.meta-docs.outputs.tags ||
            steps.meta-storybook.outputs.tags }}
          labels:
            ${{ matrix.image_suffix == 'docs' && steps.meta-docs.outputs.labels
            || steps.meta-storybook.outputs.labels }}

      - name: Trigger docs redeploy webhook
        if: matrix.image_suffix == 'docs'
        run:
          curl --fail --silent --show-error --location "$FLOW_REDEPLOY_WEBHOOK"
        env:
          FLOW_REDEPLOY_WEBHOOK: ${{ secrets.FLOW_REDEPLOY_WEBHOOK }}

      - name: Trigger storybook redeploy webhook
        if: matrix.image_suffix == 'storybook'
        run:
          curl --fail --silent --show-error --location
          "$STORYBOOK_REDEPLOY_WEBHOOK"
        env:
          STORYBOOK_REDEPLOY_WEBHOOK: ${{ secrets.STORYBOOK_REDEPLOY_WEBHOOK }}
