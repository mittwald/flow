name: "Build test coverage report"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/prepare-workspace

      - name: Test components
        run: pnpm nx test:unit components --coverage.enabled true

      # Not `always()`: that also runs in a run a newer push cancelled, and
      # reports the coverage of a test step that never finished.
      - name: Report Coverage
        if: "!cancelled()"
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2
        with:
          working-directory: ./packages/components/
