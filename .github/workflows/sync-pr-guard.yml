name: Sync PR guard

# Fails a pull request that introduces git conflict markers.
#
# Plain hygiene, not a load-bearing gate. `pnpm sync:resolve --continue` already
# refuses to commit a resolution while markers are left, and that is the intended
# path out of a forward-merge conflict (ADR 0004 §4) — this catches the
# hand-rolled resolution that skipped it, and the occasional stray marker in an
# ordinary PR, which is a defect wherever it appears.
#
# It runs on every pull request and passes trivially for the overwhelming
# majority, so it is cheap to require as a status check. It reads the diff through
# the API instead of checking the repository out: the scan needs no working tree,
# and a full-history checkout of this monorepo for a grep would be absurd.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  no-conflict-markers:
    name: No conflict markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Scan the pull request diff for conflict markers
        run: |
          set -euo pipefail

          # Built at runtime so that this workflow file does not match its own
          # pattern when the guard is (inevitably) pointed at this repository.
          open_marker="$(printf '<%.0s' 1 2 3 4 5 6 7)"
          close_marker="$(printf '>%.0s' 1 2 3 4 5 6 7)"

          diff="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
            -H "Accept: application/vnd.github.v3.diff")"

          # Only ADDED lines matter: a marker already present in the base is not
          # this PR's doing. The `=======` marker is deliberately not matched — it
          # is far too common in ordinary text to be a reliable signal.
          hits="$(printf '%s\n' "$diff" \
            | grep -E "^\+(${open_marker}|${close_marker})" || true)"

          if [ -n "$hits" ]; then
            echo "::error::This pull request introduces git conflict markers — resolve them before merging."
            printf '%s\n' "$hits"
            exit 1
          fi

          echo "No conflict markers introduced."
