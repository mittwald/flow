# The `next` line has no standing environment of its own: pull-request previews
# die with their PR, and only `main` reaches flow.mittwald.de. So every feature
# already merged for the next minor was invisible until it was promoted. This
# publishes the collection branch under a permanent preview host, using the same
# images, services and ingresses as a pull-request preview — the deploy script
# is keyed by a slug, and this one's is `next`.
name: Build & Deploy next preview

on:
  push:
    branches:
      - next

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A preview only has to show the branch head, so a push that arrives while the
# previous one is still building supersedes it. (`deploy-main` cannot do this:
# there, every push must reach production.)
concurrency:
  group: deploy-next
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: docs
            context: apps/docs
            image_suffix: docs
          - app: storybook
            context: packages/components
            image_suffix: storybook

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v6

      - uses: ./.github/actions/prepare-workspace

      # Next keeps its compiler and render caches here; restoring them is what
      # keeps a docs build off the cold path (see build-previews.yml).
      - name: Cache the Next.js build cache
        if: matrix.image_suffix == 'docs'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/docs/.next/cache
          key:
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
            github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build the docs
        if: matrix.image_suffix == 'docs'
        run: pnpm nx build docs
        env:
          NEXT_BASE_PATH: ""
          # Not the canonical site, so `robots.ts` emits a blanket Disallow —
          # this host is permanent and would otherwise compete with
          # flow.mittwald.de for the same queries.
          NEXT_PUBLIC_SITE_URL: https://next.docs.review.flow-components.de

      # Two commands because `build:storybook` declares no nx dependency on the
      # components build.
      - name: Build Storybook
        if: matrix.image_suffix == 'storybook'
        run: |
          pnpm nx build components
          pnpm nx build:storybook components

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=ref,event=branch` is the `next` tag the deploy job pulls by; the
      # sha tag is there to identify what a running preview actually holds.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images:
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The built output and the server config beside it, nothing else — see
          # the context's own .dockerignore.
          context: ${{ matrix.context }}
          push: true
          provenance: false # single-manifest image; deploy pulls by ref
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The services already exist after the first run, so this is a no-op plus
      # an image pull from then on. No GITHUB_TOKEN: the PR-state guard and the
      # preview comment only apply to a `pr-<number>` slug.
      - name: Deploy the next preview environment
        env:
          PREVIEW_SLUG: next
          MITTWALD_PROJECT_ID: ${{ secrets.MITTWALD_PROJECT_ID }}
          MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
          MITTWALD_TLS_CERTIFICATE_ID_DOCS:
            ${{ secrets.MITTWALD_TLS_CERTIFICATE_ID_DOCS }}
          MITTWALD_TLS_CERTIFICATE_ID_STORYBOOK:
            ${{ secrets.MITTWALD_TLS_CERTIFICATE_ID_STORYBOOK }}
          DOCS_IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/docs:next
          STORYBOOK_IMAGE_TAG:
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/storybook:next
        run: |
          pnpm tsx dev/deploy-review.ts
