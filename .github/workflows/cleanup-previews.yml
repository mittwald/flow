name: Cleanup Preview Apps

on:
  pull_request:
    types:
      - closed
  # Manual escape hatch to clean up an orphaned preview — e.g. one left behind by
  # a PR that was merged before its deploy finished (see the concurrency note).
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose orphaned preview should be cleaned up"
        required: true
        type: string

permissions:
  contents: read

# Shared with build-previews.yml: queuing this cleanup cancels a still-running
# build+deploy for the same PR, closing the race where a deploy finishes after
# the cleanup and orphans the preview resources.
concurrency:
  group:
    preview-${{ github.event.pull_request.number ||
    github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Same reasoning as the deploy job in `build-previews.yml`: Dependabot
      # merges its own PRs, so this `closed` event is a Dependabot-triggered run
      # holding the MITTWALD_* credentials. Check out the base revision so the
      # bumped dependency's code never runs here.
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v6
        with:
          ref:
            ${{ github.actor == 'dependabot[bot]' &&
            github.event.pull_request.base.sha || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cleanup preview environment
        env:
          PR_NUMBER:
            ${{ github.event.pull_request.number || github.event.inputs.pr_number
            }}
          MITTWALD_PROJECT_ID: ${{ vars.MITTWALD_PROJECT_ID }}
          MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
        run: |
          pnpm tsx dev/cleanup-review.ts
