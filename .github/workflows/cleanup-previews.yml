name: Cleanup Preview Apps

on:
  pull_request:
    types:
      - closed
  # Manual escape hatch to clean up an orphaned preview — e.g. one left behind by
  # a PR that was merged before its deploy finished (see the concurrency note).
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose orphaned preview should be cleaned up"
        required: true
        type: string

permissions:
  contents: read

# Shared with build-previews.yml: queuing this cleanup cancels a still-running
# build+deploy for the same PR, closing the race where a deploy finishes after
# the cleanup and orphans the preview resources.
concurrency:
  group:
    preview-${{ github.event.pull_request.number ||
    github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dependabot merges its own PRs, so the `closed` event is a
      # Dependabot-triggered run — where `secrets.*` resolves against the
      # Dependabot store and the MITTWALD_* credentials arrive empty. The
      # cleanup for them happens in
      # `cleanup-previews-dependabot.yml`, which this run triggers via
      # `workflow_run`. The steps are skipped rather than the job: a job-level
      # `if` concludes the whole run `skipped`, and only a run that actually
      # completes is a dependable trigger.
      CLEAN_UP_HERE: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout repository
        if: env.CLEAN_UP_HERE == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        if: env.CLEAN_UP_HERE == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        if: env.CLEAN_UP_HERE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: env.CLEAN_UP_HERE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cleanup preview environment
        if: env.CLEAN_UP_HERE == 'true'
        env:
          PR_NUMBER:
            ${{ github.event.pull_request.number || github.event.inputs.pr_number
            }}
          MITTWALD_PROJECT_ID: ${{ secrets.MITTWALD_PROJECT_ID }}
          MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
        run: |
          pnpm tsx dev/cleanup-review.ts
