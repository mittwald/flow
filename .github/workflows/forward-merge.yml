name: Forward-merge main into next

# Forward-merge cascade (ADR 0004). Keeps the higher release line a superset of
# the lower one BY CONSTRUCTION: every change on `main` is merged up into `next`
# as a TRUE merge commit (never rebase/squash/cherry-pick), so `main` stays an
# ancestor of `next` and routine merges never re-collide (ADR 0004 §1).
#
# The workflow is idempotent: it merges the CURRENT `main` tip into `next`, not
# "a specific commit" (ADR 0004 §2). A `fix:` push and the later
# `chore(release):` push both trigger a run; both converge on "next contains
# main's tip", and the churn-only run collapses to an empty merge with no push
# (ADR 0004 §6/§7).
#
# Version/changelog divergence between the lines is absorbed by the
# `.gitattributes` merge drivers (registered below, ADR 0004 §3). Only a genuine
# code conflict escalates to the `sync/main-to-next` PR (ADR 0004 §4). Any other
# failure opens an issue (ADR 0004 §10).
#
# The push to `next` triggers `publish-next.yml`, which re-derives the version
# and publishes the `next` prerelease (ADR 0004 §6). This workflow itself stays
# version-free — it merges and pushes, nothing more.

on:
  push:
    branches:
      - main
  # First-class manual recovery/force path (ADR 0004 §2): a manual run merges
  # the current `main` tip into `next` exactly like an automatic one.
  workflow_dispatch:

permissions:
  contents: write # push the merge commit / sync branch
  pull-requests: write # open the sync PR
  issues: write # open the failure issue (ADR 0004 §10)

# One shared concurrency group per TARGET branch, used by every workflow that
# pushes to `next` (this one and `publish-next.yml`) — serializes all writers of
# `next` and removes non-fast-forward races by design (ADR 0004 §5).
concurrency:
  group: mutate-next
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.PUBLISH_PAT }}
  REPO: ${{ github.repository }}

jobs:
  forward-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Self-gating (mirrors commit-guard.yml): the cascade only exists once the
      # `next` collection branch does, i.e. after the 1.0.0 cut. Until then this
      # workflow is dormant, so pushes to `main` on the `0.2.0-alpha.*` line do
      # not fail.
      - name: Check whether the `next` branch exists yet
        id: guard
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads \
               "https://github.com/${REPO}.git" next >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::'next' branch does not exist yet — forward-merge dormant (pre-1.0.0-cut). Skipping."
          fi

      - name: Checkout `next` ⬇️
        if: steps.guard.outputs.exists == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: next
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT }}

      # A pinned Node just for the JSON merge driver (`.github/scripts/merge-
      # package-json.cjs`); no dependency install — the merge is version-free.
      - name: Setup Node 🎛️
        if: steps.guard.outputs.exists == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Git identity 🪪
        if: steps.guard.outputs.exists == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      # A `merge=<driver>` attribute is inert unless the driver is registered in
      # the runner's git config too (ADR 0004 §3, Consequences).
      - name: Register merge drivers 🔧
        if: steps.guard.outputs.exists == 'true'
        run: |
          set -euo pipefail
          git config merge.ours.driver true
          git config merge.package-json.driver \
            "node .github/scripts/merge-package-json.cjs %O %A %B %L %P"

      - name: Forward-merge and push (or open sync PR) 🔀
        id: merge
        if: steps.guard.outputs.exists == 'true'
        run: |
          set -euo pipefail

          # If a sync PR is already open, a maintainer may be resolving the
          # conflict on that branch RIGHT NOW. Never touch the branch in that
          # case — a force-push would silently discard their resolution commits.
          # Let the existing PR carry the resolution; once it merges, the next
          # run re-evaluates against the new `next`.
          sync_pr_open() {
            gh pr list --repo "$REPO" --head "sync/main-to-next" \
              --base next --state open --json number --jq '.[].number'
          }

          # git writes conflict markers only for a CONTENT conflict on a text
          # file that has both sides staged (stage 2 = ours, stage 3 = theirs).
          # A delete/modify or rename conflict carries only one of them, and a
          # binary file gets no markers at all — committing those with `git add`
          # would silently pick a side. Only the plain-text case may be
          # pre-merged; anything else falls back to the raw sync branch.
          conflicts_are_plain_text() {
            local path stages
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              stages="$(git ls-files --unmerged -- "$path" | awk '{print $3}' | sort -u | tr -d '\n')"
              case "$stages" in
                *2*3* | *3*2*) : ;;
                *)
                  echo "::notice::${path} is not a plain content conflict (stages: ${stages:-none})."
                  return 1
                  ;;
              esac
              if ! grep -Iq . "$path" 2>/dev/null; then
                echo "::notice::${path} is binary — no usable conflict markers."
                return 1
              fi
            done < <(git ls-files --unmerged | cut -f2 | sort -u)
          }

          # Pre-merged escalation. At this point the runner has already done the
          # work: the drivers resolved the version/CHANGELOG churn in the index,
          # and only genuine conflicts are unmerged. Aborting and handing a human
          # a raw branch at main's tip throws that away and makes them redo it —
          # and because GitHub does not run merge drivers, the PR-side merge shows
          # the whole churn as conflicts again (35 files in the #2769 rehearsal,
          # 34 of them noise). So commit the partial merge instead: markers land
          # only in the files that genuinely conflict.
          #
          # The catch: such a PR LOOKS mergeable to GitHub, because its head
          # contains the base. Two independent defences, because the invariant in
          # ADR 0004 §1 must not be breakable by a misconfiguration:
          #
          #   1. The PR is opened as a DRAFT. GitHub refuses to merge a draft, so
          #      this holds even where no branch protection is configured. Marking
          #      it ready for review IS the signal that the resolution is done.
          #   2. `sync-pr-guard.yml` fails while markers are present; as a required
          #      check on `next` it blocks the merge even if someone un-drafts a
          #      PR that is not actually resolved.
          #
          # Markers are deliberately preferred over any "clean but incomplete"
          # hand-over (resolve to one side, ship the other side as a patch): that
          # would produce a mergeable branch that silently drops main's change.
          # Markers fail loudly — in the diff, in the build, in the tests.
          open_sync_pr_premerged() {
            local branch="sync/main-to-next" open_pr conflicted body
            open_pr="$(sync_pr_open)"
            if [ -n "$open_pr" ]; then
              echo "::notice::Sync PR #${open_pr} already open — leaving its branch untouched (a maintainer may be resolving it)."
              return 0
            fi

            conflicted="$(git ls-files --unmerged | cut -f2 | sort -u | sed 's/^/- `/; s/$/`/')"

            git add -A
            git commit -q -m "${MERGE_MSG} [UNRESOLVED CONFLICTS]"
            git push --force origin "HEAD:refs/heads/${branch}"

            gh label create sync --repo "$REPO" --color BFD4F2 \
              --description "Forward-merge / promotion sync PR" 2>/dev/null || true
            gh label create automated --repo "$REPO" --color EDEDED \
              --description "Opened by automation" 2>/dev/null || true

            body="$(printf '%s\n' \
              'The automated forward-merge of `main` into `next` hit a genuine code conflict (ADR 0004 §4) and needs a human.' \
              '' \
              '**This branch is already merged as far as the machine could take it.** The version and `CHANGELOG.md` churn was resolved by the merge drivers in the runner, so conflict markers are left in these files only:' \
              '' \
              "${conflicted}" \
              '' \
              '⚠️ **It is a draft on purpose.** Its head contains the base, so GitHub would otherwise consider it mergeable — while it still carries conflict markers. It stays a draft until a human has resolved them; the `sync-pr-guard` check backs that up.' \
              '' \
              'Resolve with an AMEND, so the marker commit never reaches `next`. A commit that does not build would otherwise sit in the history forever and break `git bisect`:' \
              '' \
              '```shell' \
              'git fetch origin' \
              'git checkout -B sync/main-to-next origin/sync/main-to-next' \
              '# fix the conflict markers in the files above, then:' \
              'git add -A' \
              'git commit --amend -m "chore(sync): forward-merge main into next"' \
              'git push --force-with-lease origin sync/main-to-next' \
              '```' \
              '' \
              'Then mark this PR **ready for review** — that is the signal that the resolution is done.' \
              '' \
              'The amend keeps both merge parents, so the superset invariant (ADR 0004 §1) still holds. Merge this PR AS A TRUE MERGE COMMIT — a squash or rebase merge would break that invariant and is blocked by branch protection on `next`.' \
              '' \
              'Note: while this PR is open the cascade leaves the branch untouched, so it does not pick up commits that land on `main` afterwards. Those arrive with the next forward-merge run once this PR is merged.')"

            gh pr create --repo "$REPO" --base next --head "$branch" \
              --draft \
              --title "chore(sync): resolve forward-merge conflict (main into next)" \
              --label sync --label automated \
              --body "$body"

            gh pr edit "$branch" --repo "$REPO" \
              --add-reviewer mfal,Lisa18289,ins0,maaaathis,Jan-Eimertenbrink \
              || echo "::warning::Could not request all CODEOWNERS reviewers."
          }

          open_sync_pr() {
            # Fallback for conflicts git cannot express as markers (delete/modify,
            # rename, binary): hand over a raw branch at main's tip and let the
            # human do the whole merge locally. Never lands on `main`:
            # conflict-resolution commits go on `sync/main-to-next`.
            local branch="sync/main-to-next"

            local open_pr
            open_pr="$(sync_pr_open)"
            if [ -n "$open_pr" ]; then
              echo "::notice::Sync PR #${open_pr} already open — leaving its branch untouched (a maintainer may be resolving it)."
              return 0
            fi

            # No open sync PR → safe to (re)create the branch at main's tip. Any
            # commits here are stale (a previously closed/merged sync attempt),
            # so resetting to main is correct.
            git push --force origin "origin/main:refs/heads/${branch}"

            # Labels must exist before use; create idempotently.
            gh label create sync --repo "$REPO" --color BFD4F2 \
              --description "Forward-merge / promotion sync PR" 2>/dev/null || true
            gh label create automated --repo "$REPO" --color EDEDED \
              --description "Opened by automation" 2>/dev/null || true

            local body
            body="$(printf '%s\n' \
              'The automated forward-merge of `main` into `next` hit a genuine code conflict (ADR 0004 §4) and needs a human.' \
              '' \
              '**Most of the conflicts shown here are not real.** GitHub does not run the merge drivers declared in `.gitattributes` — a driver only exists in local git config — so every `version` and `CHANGELOG.md` divergence between the two lines surfaces as a conflict. Resolved locally with the drivers registered, that noise disappears and only the genuine conflict is left.' \
              '' \
              'Resolve it locally, NOT in the web editor. The direction matters: the drivers keep the version of the branch you merge INTO, so the merge has to run the same way the cascade runs it.' \
              '' \
              '```shell' \
              'pnpm dev:init-merge-drivers   # a merge= attribute is inert without this' \
              'git fetch origin' \
              'git checkout -B sync/main-to-next origin/next' \
              'git merge origin/main         # drivers absorb version/CHANGELOG churn' \
              '# resolve the remaining, genuine conflict, then:' \
              'git commit' \
              'git push --force-with-lease origin sync/main-to-next' \
              '```' \
              '' \
              'Then merge this PR AS A TRUE MERGE COMMIT — a squash or rebase merge would break the superset invariant (ADR 0004 §1) and is blocked by branch protection on `next`.' \
              '' \
              'Note: while this PR is open the cascade leaves the branch untouched, so it does not pick up commits that land on `main` afterwards. Those arrive with the next forward-merge run once this PR is merged.')"

            gh pr create --repo "$REPO" --base next --head "$branch" \
              --title "chore(sync): resolve forward-merge conflict (main into next)" \
              --label sync --label automated \
              --body "$body"

            # Request review from CODEOWNERS (the Frontend Core Team). Kept
            # non-fatal: the PR must exist even if a reviewer request is rejected
            # (e.g. the automation identity is itself one of the owners).
            gh pr edit "$branch" --repo "$REPO" \
              --add-reviewer mfal,Lisa18289,ins0,maaaathis,Jan-Eimertenbrink \
              || echo "::warning::Could not request all CODEOWNERS reviewers."
          }

          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          SHORT_SHA="$(git rev-parse --short origin/main)"
          NEXT_BEFORE="$(git rev-parse HEAD)"
          MERGE_MSG="chore(sync): forward-merge main into next (${SHORT_SHA})"

          echo "Merging main (${SHORT_SHA}) into next ($(git rev-parse --short HEAD))"

          # True merge commit with an explicit conventional message (ADR 0004
          # §1, §8) — `chore(sync):` is valid-conventional and non-releasing.
          if git merge --no-ff -m "$MERGE_MSG" "$MAIN_SHA"; then
            echo "Merge succeeded."
          elif [ -n "$(git ls-files --unmerged)" ]; then
            echo "::warning::Merge conflict — escalating to the sync PR."
            if conflicts_are_plain_text; then
              open_sync_pr_premerged
            else
              echo "::warning::Not a plain-text-only conflict — falling back to a raw sync branch."
              git merge --abort
              open_sync_pr
            fi
            exit 0
          else
            echo "::error::git merge failed without a conflict."
            exit 1
          fi

          # Empty forward-merge (ADR 0004 §6/§7): if the merge brought in no code
          # delta (only version/changelog churn the drivers absorbed), the tree
          # is unchanged. Drop the empty merge and skip the push, so no spurious
          # `next` re-publish is triggered.
          if git diff --quiet "$NEXT_BEFORE" HEAD; then
            echo "No code delta after merge — skipping push (nothing to re-publish)."
            git reset --hard "$NEXT_BEFORE"
            exit 0
          fi

          # Push with one fetch-before-push retry on non-fast-forward (ADR 0004
          # §5, belt-and-suspenders on top of the shared concurrency group).
          if git push origin HEAD:next; then
            echo "Pushed forward-merge to next."
            exit 0
          fi

          echo "::warning::Push rejected (non-fast-forward) — refetching next and retrying once."
          git fetch --no-tags origin next
          if git merge --no-ff -m "$MERGE_MSG" origin/next; then
            git push origin HEAD:next
            echo "Pushed forward-merge to next after retry."
            exit 0
          fi

          if [ -n "$(git ls-files --unmerged)" ]; then
            echo "::warning::Conflict against a concurrent next writer — escalating to the sync PR."
            git merge --abort
            open_sync_pr
            exit 0
          fi
          echo "::error::Retry re-merge/push failed."
          exit 1

      # A conflict is the expected non-error path (handled above, exits 0). Any
      # genuine failure (retry exhausted, workflow error) must not let `next`
      # silently fall behind `main` — open an issue and ping CODEOWNERS (ADR
      # 0004 §10).
      - name: Open an issue on failure 🚨
        if: failure() && steps.guard.outputs.exists == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create automated --repo "$REPO" --color EDEDED \
            --description "Opened by automation" 2>/dev/null || true
          body="$(printf '%s\n' \
            'The automated forward-merge of main into next failed for a reason OTHER THAN a merge conflict (ADR 0004 §10). next may now be falling behind main.' \
            '' \
            "Run: ${RUN_URL}" \
            '' \
            '/cc @mfal @Lisa18289 @ins0 @maaaathis @Jan-Eimertenbrink')"
          gh issue create --repo "$REPO" --label automated \
            --title "Forward-merge main into next failed" \
            --body "$body" \
            || echo "::warning::Could not open the failure issue."
