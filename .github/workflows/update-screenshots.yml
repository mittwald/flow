name: Update Visual Regression Screenshots

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled

env:
  # simple-git-hooks' postinstall runs on every `pnpm install` and writes
  # .git/hooks from package.json, so `pre-push` = `pnpm lint` would run on the
  # push below — a full repo lint to ship a screenshot commit, and a formatting
  # drift anywhere on the branch would fail this job after it already committed
  # (#2932).
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
  AUTHOR_NAME: "github-actions[bot]"
  AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
  COMMIT_MESSAGE: |
    test: update visual regression screenshots

    Co-authored-by: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>

jobs:
  update-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      ${{ (github.event.label.name == 'update-screenshots') && (github.head_ref != github.event.repository.default_branch) }}

    # one at a time per branch
    concurrency:
      group:
        visual-regression-screenshots@${{ github.head_ref }}@${{
        github.event.label.name }}
      cancel-in-progress: true

    permissions:
      contents: write # needs to push changes
      pull-requests: write # needs to remove the triggering label

    steps:
      - name: Remove label if exists
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const label = "update-screenshots";
            try {
                await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    name: label,
                });
                console.log(`Label '${label}' removed.`);
            } catch (e) {
                if (e.status === 404) {
                   console.log(`Label '${label}' not present, skipping.`);
                } else {
                    throw e;
                }
            }

      - name: Checkout selected branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "${{ env.AUTHOR_NAME }}"
          git config --global user.email "${{ env.AUTHOR_EMAIL }}"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: pnpm test:browser:prepare --only-shell

      # `test:visual` only declares `^build`; building the package itself is a
      # superset of that (same as .github/actions/run-visual-shard).
      - name: Build the packages the visual suite renders
        run: pnpm nx run remote-react-components:build

      # Deliberately not `pnpm test:visual --update` (= `nx run-many`): nx
      # buffers a task's output and prints it when the task ends, and the
      # process exits before the pipe is drained. The first ~64 KB of vitest's
      # output made it into the job log, the failure summary never did — three
      # runs in a row went red with nothing but a line cut off mid-word to show
      # for it. Calling vitest directly streams the whole run.
      #
      # In the same six shards the verify runs use (test-visual-label.yml,
      # test-visual-scheduled.yml), one after another: the update needs every
      # baseline in one checkout, so it cannot spread them over runners. The
      # split is not for speed. With `fileParallelism: false` vitest opens one
      # page per browser for the whole run and plays every test file into it as
      # an iframe, and that page's memory grows with each file — every
      # unsharded run since 2026-09-02 lost the browser around the 105th of 168
      # file runs (`[vitest] Browser connection was closed while running
      # tests`, #3118). Each shard is its own vitest process with fresh
      # browsers, so no page ever carries more than a sixth of the suite — the
      # conditions the baselines are verified under. vitest hashes the file
      # paths into shards, so the split is the verify runs' split.
      - name: Update Visual Regression Screenshots
        run: |
          shards=6
          for shard in $(seq 1 "$shards"); do
            echo "::group::Visual tests, shard $shard/$shards"
            if ! pnpm --filter @mittwald/flow-remote-react-components test:visual:update --shard="$shard/$shards"; then
              echo "::endgroup::"
              echo "::error::Shard $shard/$shards failed."
              exit 1
            fi
            echo "::endgroup::"
          done
      # check what changed
      - name: Check for changes
        id: check_changes
        run: |
          CHANGED_FILES=$(git status --porcelain | awk '{print $2}')
          if [ "${CHANGED_FILES:+x}" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"

            # save the list for the summary
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "changed_count=$(echo "$CHANGED_FILES" | wc -l)" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add -A
          git commit -m "${{ env.COMMIT_MESSAGE }}"

      - name: Push changes
        if: steps.check_changes.outputs.changes == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git push origin "$HEAD_REF"

      - name: Summary
        env:
          CHANGES: ${{ steps.check_changes.outputs.changes }}
          CHANGED_COUNT: ${{ steps.check_changes.outputs.changed_count }}
          CHANGED_FILES: ${{ steps.check_changes.outputs.changed_files }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$CHANGES" == "true" ]]; then
            echo "### 📸 Visual Regression Screenshots Updated" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Successfully updated **$CHANGED_COUNT** screenshot(s) on \`$HEAD_REF\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Changed Files:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$CHANGED_FILES" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ The updated screenshots have been committed and pushed. Your visual regression baseline is now up to date!" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ℹ️ No Screenshot Updates Required" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The visual regression test command ran successfully but no screenshots needed updating." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All screenshots are already up to date! 🎉" >> "$GITHUB_STEP_SUMMARY"
          fi
