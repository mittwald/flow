name: Commit guard

# Enforces the two commit-level gates of the 1.0.0 release model (RFC #2711):
#
# 1. Conventional PR title — the whole model derives versioning and the
#    changelog from the merged commit's type. Because this repo squash-merges
#    (the PR title becomes the commit subject), the PR *title* is what must be a
#    valid Conventional Commit, so that is what we lint.
# 2. Routing — where a change is allowed to land:
#      - a feature (`feat:`) belongs on `next`, not on `main`;
#      - a breaking change (`feat!:` / `BREAKING CHANGE`) belongs on the major
#        line, not on any standing line (`main` *or* `next`).
#    This makes the dangerous directions mechanically hard.
# 3. Commit mixture — the squash merge keeps only the TITLE, so the title has to
#    be the whole truth about the branch. A PR that mixes a `feat:` and a `fix:`
#    commit cannot be told in one subject; a `feat:` or breaking commit under a
#    `fix:` title walks straight past routing onto `main`; and a non-releasing
#    title over shipping paths announces a released change as documentation.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commit-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The Conventional Commit types Flow derives releases + changelog from.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Scopes are a convention here (e.g. `fix(Button):`), not mandatory
          # (e.g. `chore(release):` vs. a scopeless `ci:`), so don't force one.
          requireScope: false

  routing:
    name: Routing (feature -> next, breaking -> major line)
    # PRs targeting a standing release line are subject to routing.
    if: >-
      github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'next'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Enforce release-line routing
        run: |
          set -euo pipefail

          # --- Promotion / forward-merge exemption (ADR 0004 §8) ---------------
          # A promotion PR (`release/x.y.0 -> main`, which is what
          # `/prepare-release` opens, or a major line -> main) and a sync PR are
          # *supposed* to carry feat:/breaking commits. Exempt those heads, or
          # they would block the release itself. `release/*` was missing here
          # until the #2769 rehearsal: the first real promotion PR passed routing
          # only because its title happened to carry no `feat` marker, which is
          # luck rather than intent.
          if [ "$HEAD_REF" = "next" ] \
             || printf '%s' "$HEAD_REF" | grep -qE '^([0-9]+\.(x|[0-9]+)|next-major)$' \
             || printf '%s' "$HEAD_REF" | grep -qE '^(sync|release)/'; then
            echo "::notice::head='${HEAD_REF}' is a promotion/sync source — routing guard exempt."
            exit 0
          fi

          # --- Classify the PR title / body ------------------------------------
          is_feat=0
          is_breaking=0
          if printf '%s' "$PR_TITLE" | grep -qiE '^feat(\([^)]+\))?!?:'; then is_feat=1; fi
          if printf '%s' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then is_breaking=1; fi
          if printf '%s\n' "$PR_BODY" | grep -qE '^[[:space:]]*BREAKING(-| )CHANGE:'; then is_breaking=1; fi

          # --- The rules -------------------------------------------------------
          fail=0

          # A breaking change belongs on the major line — never on a standing
          # line (neither `main` nor `next`).
          if [ "$is_breaking" -eq 1 ]; then
            echo "::error::PR marks a breaking change — breaking changes target the major line, not '${BASE_REF}'."
            fail=1
          fi

          # A feature belongs on `next`, not directly on `main`.
          if [ "$BASE_REF" = "main" ] && [ "$is_feat" -eq 1 ]; then
            echo "::error::PR title is a 'feat' — features target 'next', not 'main'."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Routing: 'main' takes fix:/docs:/chore:/…; 'next' additionally takes feat:; breaking changes go to the major line."
            exit 1
          fi

          echo "Routing OK for base '${BASE_REF}'."

  version-contract:
    name: Version contract (engines.node + peer ranges)
    # Same standing-line scope as routing: only PRs targeting a release line.
    if: >-
      github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'next'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Gate (promotion/sync exemptions)
        id: gate
        run: |
          set -euo pipefail

          # Promotion / forward-merge / sync sources legitimately carry breaking
          # changes (ADR 0004 §8) — exempt, same as routing.
          if [ "$HEAD_REF" = "next" ] \
             || printf '%s' "$HEAD_REF" | grep -qE '^([0-9]+\.(x|[0-9]+)|next-major)$' \
             || printf '%s' "$HEAD_REF" | grep -qE '^(sync|release)/'; then
            echo "::notice::head='${HEAD_REF}' is a promotion/sync source — version-contract guard exempt."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (full history so the base commit is reachable)
        if: steps.gate.outputs.active == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Self-test the classifier
        if: steps.gate.outputs.active == 'true'
        run: node --test .github/scripts/version-contract-lib.test.mjs

      - name: Enforce the version contract
        if: steps.gate.outputs.active == 'true'
        run: node .github/scripts/version-contract-guard.mjs

  commit-mixture:
    name: Commit mixture (one release class per PR)
    # Same standing-line scope as routing: only PRs targeting a release line.
    if: >-
      github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'next'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Gate (promotion/sync exemptions)
        id: gate
        run: |
          set -euo pipefail

          # A promotion or sync source carries every class by design — that is
          # what it is for (ADR 0004 §8) — so it is exempt, same as routing and
          # the version contract.
          if [ "$HEAD_REF" = "next" ] \
             || printf '%s' "$HEAD_REF" | grep -qE '^([0-9]+\.(x|[0-9]+)|next-major)$' \
             || printf '%s' "$HEAD_REF" | grep -qE '^(sync|release)/'; then
            echo "::notice::head='${HEAD_REF}' is a promotion/sync source — commit-mixture guard exempt."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (full history so the merge base is reachable)
        if: steps.gate.outputs.active == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Self-test the classifiers
        if: steps.gate.outputs.active == 'true'
        run: |
          node --test .github/scripts/commit-mixture-lib.test.mjs
          node --test .github/scripts/release-relevance-lib.test.mjs

      # The same classifier the release gate runs, so both answer alike. It
      # writes `publish=` to this step's outputs; the snapshots come out of git
      # rather than the compare API, because this checkout has history.
      - name: Classify the changed paths
        id: relevance
        if: steps.gate.outputs.active == 'true'
        run: |
          set -euo pipefail

          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          files="$(git diff --name-only "${base}" "$HEAD_SHA")"

          export MANIFEST_SNAPSHOT_DIR="${RUNNER_TEMP}/manifests"
          mkdir -p "${MANIFEST_SNAPSHOT_DIR}/before" "${MANIFEST_SNAPSHOT_DIR}/after"
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            slug="$(printf '%s' "$manifest" | sed 's|/|__|g')"
            git show "${base}:${manifest}" \
              > "${MANIFEST_SNAPSHOT_DIR}/before/${slug}.json" 2>/dev/null \
              || rm -f "${MANIFEST_SNAPSHOT_DIR}/before/${slug}.json"
            git show "${HEAD_SHA}:${manifest}" \
              > "${MANIFEST_SNAPSHOT_DIR}/after/${slug}.json" 2>/dev/null \
              || rm -f "${MANIFEST_SNAPSHOT_DIR}/after/${slug}.json"
          done <<< "$(printf '%s\n' "$files" \
            | grep -E '^(package\.json|packages/[^/]+/package\.json)$' || true)"

          printf '%s\n' "$files" \
            | node .github/scripts/release-relevance-guard.mjs

      - name: Check the commit mixture
        if: steps.gate.outputs.active == 'true'
        env:
          # Empty when the step above could not answer — then that half is
          # skipped rather than guessed.
          PATHS_PUBLISH: ${{ steps.relevance.outputs.publish }}
        run: |
          set -euo pipefail
          git log -z --reverse --format=%s%n%b \
            "${{ steps.relevance.outputs.base }}..${HEAD_SHA}" \
            | node .github/scripts/commit-mixture-guard.mjs
