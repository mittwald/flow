name: Commit guard

# Enforces the two commit-level gates of the 1.0.0 release model (RFC #2711):
#
# 1. Conventional PR title — the whole model derives versioning and the
#    changelog from the merged commit's type. A squash merge makes the PR title
#    the commit subject, so the PR *title* must be a valid Conventional Commit.
# 2. Routing — where a change is allowed to land:
#      - a feature (`feat:`) belongs on `next`, not on `main`;
#      - a breaking change (`feat!:` / `BREAKING CHANGE`) belongs on the major
#        line, not on any standing line (`main` *or* `next`).
#    Checked on the title and on every commit of the PR: `main` also allows
#    merge commits (the promotion needs them) and `next` allows only those, and
#    a merge commit hands every branch commit to lerna.
#    This makes the dangerous directions mechanically hard.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commit-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The Conventional Commit types Flow derives releases + changelog from.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Scopes are a convention here (e.g. `fix(Button):`), not mandatory
          # (e.g. `chore(release):` vs. a scopeless `ci:`), so don't force one.
          requireScope: false

  routing:
    name: Routing (feature -> next, breaking -> major line)
    # PRs targeting a standing release line are subject to routing. The title
    # AND every commit of the PR are checked: a merge commit hands each branch
    # commit to lerna, which is how a `feat` under a `fix:` title released
    # `main` as 1.3.0 (#3290). See `.github/scripts/routing-lib.mjs`.
    if: >-
      github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'next'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_COMMITS: ${{ github.event.pull_request.commits }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The two scripts are all this job needs, not the ~55 MB tree.
      - name: Checkout the guard scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Self-test the classifier
        run: node --test .github/scripts/routing-lib.test.mjs

      - name: Enforce release-line routing
        run: node .github/scripts/routing-guard.mjs

  version-contract:
    name: Version contract (engines.node + peer ranges)
    # Same standing-line scope as routing: only PRs targeting a release line.
    if: >-
      github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'next'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      REPO: ${{ github.repository }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # Before the gate, which reads the shared exemption rule from the checkout.
      # Exempt PRs are rare, so checking out for them too costs little.
      - name: Checkout (full history so the base commit is reachable)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Gate (promotion/sync exemptions)
        id: gate
        # Promotion / forward-merge / sync sources legitimately carry breaking
        # changes (ADR 0004 §8) — exempt by the same rule as routing, so the
        # two required checks cannot drift apart.
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { isExemptPr } from "./.github/scripts/routing-lib.mjs";
            const { HEAD_REF, HEAD_REPO, REPO, GITHUB_OUTPUT } = process.env;
            const exempt = isExemptPr({ headRef: HEAD_REF, headRepo: HEAD_REPO, repo: REPO });
            if (exempt) console.log(`::notice::head=${HEAD_REF} is a promotion/sync source — version-contract guard exempt.`);
            appendFileSync(GITHUB_OUTPUT, `active=${!exempt}\n`);
          '

      - name: Self-test the classifier
        if: steps.gate.outputs.active == 'true'
        run: node --test .github/scripts/version-contract-lib.test.mjs

      - name: Enforce the version contract
        if: steps.gate.outputs.active == 'true'
        run: node .github/scripts/version-contract-guard.mjs
