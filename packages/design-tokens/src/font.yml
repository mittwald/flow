font-family:
  body:
    value: "Inter, sans-serif"
  # Proxima Nova is the brand headline font. Flow does not ship it (licensed
  # font); apps that provide it get it, everyone else falls back to Inter.
  heading:
    value: '"Proxima Nova", Inter, sans-serif'
  code:
    value: "FiraCode, monospace"
font-weight:
  normal:
    value: normal
  semibold:
    value: 600
  bold:
    value: bold
line-height:
  value: 1.5
line-height-m:
  value: "calc({font-size-text.m} * 1.5)"
line-height-s:
  value: "calc({font-size-text.s} * 1.5)"
single-line-height:
  value: 1rem
font-size-text:
  s:
    value: 0.875rem
  m:
    value: 1rem
font-size-heading:
  xs:
    value: 1rem
  s:
    value: 1.125rem
  m:
    value: 1.25rem
  l:
    value: 1.5rem
  xl:
    value: 2rem
  xxl:
    value: 2.625rem
max-text-width:
  value: "960px"
