file-card:
  padding-x:
    value: "{size-px.s}"
  padding-y:
    value: "{size-px.xs}"
  spacing:
    value: "{size-rem.s}"
  corner-radius:
    value: "{corner-radius.m}"
  border-width:
    value: "{border-width.100}"
  border-style:
    value: "{border-style.default}"
  # Groups content like the ListItem: the separator tone, not the control
  # border (#3564). The error border keeps its status color.
  border-color:
    default:
      value: "{border.color.200}"
    error:
      value: "{danger-outline-border-color}"
  sub-title-font-size:
    value: "{font-size-text.s}"
  background-color:
    default:
      value: "{elevation.color.100}"
    hover:
      value: "{neutral-outline-background-color.hover}"
    pressed:
      value: "{neutral-outline-background-color.pressed}"
    error:
      value: "{danger.color.quiet.100}"
