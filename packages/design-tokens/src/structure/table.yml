table:
  corner-radius:
    value: "{corner-radius.l}"
  border-width:
    value: "{border-width.100}"
  border-style:
    value: "{border-style.default}"
  # Groups content like ListItem and FileCard: the separator tone, not the
  # control border (#3564). The header keeps its 2px line.
  border-color:
    value: "{border.color.200}"
  padding-x:
    value: "{size-px.m}"
  padding-y:
    value: "{size-px.s}"
  header-font-weight:
    value: "{font-weight.bold}"
  header-border-width:
    value: "{border-width.200}"
  footer-font-weight:
    value: "{font-weight.bold}"
  footer-border-width:
    value: "{border-width.200}"
  background-color:
    value: "{elevation.color.100}"
  background-color-accent:
    value: "{elevation.color.200}"
