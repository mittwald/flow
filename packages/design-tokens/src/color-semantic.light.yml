# Semantic tier (ADR 0007), light theme: colors with a meaning. The only
# tier that distinguishes light and dark; references Brand or, where Flow
# owns the color, holds a literal. Keep the keys in sync with
# color-semantic.dark.yml.
#
# Roles (#3455). Every key counts by emphasis, not lightness: 100 is the
# quietest in both themes.
#
# Colored and alpha groups have six tones:
#   quiet.100–300   soft surface, hover, pressed; plain/outline hover, pressed
#   strong.100–300  solid surface, hover, pressed; strong.100 is also plain
#                   text and link, strong.200 text on soft/outline
# Hover and pressed take the next Brand step; light mittwald-blue takes every
# second step (1000/1200/1400), its dark half is too dense (ΔE 3.5, #3479).
# strong.100 is the step closest to the Brand base that keeps AA (primary:
# the base). Decorative groups take their soft surface (quiet.100) from the
# brand's Background/Brand-100 (Figma "mittwald. Website Library", #3550):
# blue 300, navy and lilac 400, sage and salmon 500; strong follows the AA
# rule for text on these surfaces. content is decorative content on any
# surface (Icon, Color): the step closest to the Brand base that still reads
# as the hue, AA not required (#3508).
# Selected is a resting state: plain/outline selected takes the soft surface
# (quiet.100), not pressed. Status groups pick their steps by role (#3454, #3532).
#
# The neutral ramp has three roles of its own (keys 100–300, quiet to strong):
#   elevation  100 raised (card, modal), 200 ground (page, field, track),
#              300 inset; also what has to match a surface (switch knob,
#              slider handle, selected tab, knock-out rings)
#   content    100 secondary (icon, placeholder), 200 label, 300 text;
#              inverse is content on strong surfaces
#   border     100 groups (card, overlay), 200 separates (separator, chart
#              grid), 300 outlines controls: as light as 3:1 on neutral
#              surfaces and field hover allows (#3539); light misses 3:1
#              on the colored tints (AccentBox, sender Message)
# Everything else takes neutral quiet/strong. Disabled takes
# unavailable.quiet (surface, border, content); unavailable sits as low as
# AA allows (strong.100 = content.100).
#
# Decorative groups: one per mittwald brand color, named like the color
# props (sage = mittwald-green, salmon = mittwald-orange, #3508). Status
# colors are not duplicated; components map their color props onto these
# groups.
#
# Dark takes the contrast steps of light (content) or the role (elevation:
# the page sits below the card), not the mirrored step.

