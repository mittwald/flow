# Literal values: Flow owns these colors outright (ADR 0007).
transparent:
  color:
    value: transparent

categorical:
  color:
    sea-green:
      value: "#0fb5ae"
    palatinate-blue:
      value: "#4046ca"
    tangerine:
      value: "#f68511"
    magenta:
      value: "#de3d82"
    tropical-indigo:
