# Semantic tier (ADR 0007), dark theme: colors with a meaning. The only
# tier that distinguishes light and dark; references Brand or, where Flow
# owns the color, holds a literal. Keep the keys in sync with
# color-semantic.light.yml.
#
# Provisional until the Semantic roles (#3455): each step references the
# Brand step closest in luminance to its value before the brand palette
# (#3453).
#
# Status colors (info, success, danger, warning) pick Brand steps by role
# (#3454), not by luminance:
#   soft 100–300  → 100–300             (dark: 1800–1600)
#   solid 800     → 1300, success 1600  (dark: 700, success 1000)
#   text 900      → 1500, success 1700  (dark: 500, success 600)
#   pressed 1000  → 1600, success 1800  (dark: 400, success 500)
# 400–700 and 1100 are unused and fill the ramp in order. decorative-red,
# -orange and -green mirror danger, warning and success.
