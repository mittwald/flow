# Literal values: Flow owns these colors outright (ADR 0007).
transparent:
  color:
    value: transparent

categorical:
  color:
    sea-green:
      value: "#0fb5ae"
    palatinate-blue:
      value: "#4046ca"
    tangerine:
      value: "#f68511"
    magenta:
      value: "#de3d82"
    tropical-indigo:
      value: "#7e84fa"
    malachite:
      value: "#72e06a"
    azure:
      value: "#147af3"
    violet:
      value: "#7326d3"
    yellow:
      value: "#e8c600"
    alloy-orange:
      value: "#cb5d00"
    green:
      value: "#008f5d"
    lime:
      value: "#bce931"

code-syntax:
  color:
    keyword:
      value: "#ff7b72"
    type:
      value: "#d2a8ff"
    variable:
      value: "#79c0ff"
    property:
      value: "#d2a8ff"
    string:
      value: "#a5d6ff"
    number:
      value: "#79c0ff"
    comment:
      value: "#a0a7b0"
    function:
      value: "#d2a8ff"
    operator:
      value: "#ff7b72"
    invalid:
      value: "#f97583"

gradient:
  color:
    value:
      "radial-gradient(circle at 18% 20%, #3D55C159, transparent 22%),
      radial-gradient(circle at 82% 18%, #00A1B54D, transparent 18%),
      radial-gradient(circle at 70% 82%, #715DEE47, transparent 24%),
      linear-gradient(180deg, #06070A 0%, #0A0E18 45%, #0F1424 100%)"

background-gradient:
  color:
    value:
      "linear-gradient(180deg,rgba(18, 21, 24, 1) 0%, rgba(35, 41, 64, 1) 80%)"
