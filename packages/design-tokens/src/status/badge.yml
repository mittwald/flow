badge:
  font-size:
    value: "{font-size-text.s}"
  font-weight:
    value: "{font-weight.bold}"
  line-height:
    value: "{single-line-height}"
  corner-radius:
    value: "{corner-radius.xl}"
  # No border: the soft surface alone carries the badge (#3550). AlertBadge
  # shares the width.
  border-width:
    value: 0px
  border-style:
    value: "{border-style.default}"
  padding-y:
    value: "{size-rem.xs}"
  padding-x:
    value: "{size-rem.s}"
  spacing:
    value: "{size-rem.xs}"

  # Neutral
  neutral-background-color:
    default:
      value: "{neutral.color.quiet.100}"
    hover:
      value: "{neutral.color.quiet.200}"
    pressed:
      value: "{neutral.color.quiet.300}"
  neutral-content-color:
    value: "{neutral.color.strong.200}"
  neutral-scope-background-color:
    value: "{neutral.color.strong.100}"
  neutral-scope-content-color:
    value: "{text.color.light}"

  # Blue
