# Brand tier (ADR 0007): the palette from the brand handover. Theme-neutral,
# literal values only. Components never reference it — Semantic does.
#
# Source: Figma "mittwald. Global Tokens", collection Color Primitives (#3449),
# taken 1:1 (#3453). Hue ramps have 19 steps with the base color at 1000:
# 100–900 mix toward mittwald-neutral.300, 1100–1900 toward a dark background.
# Provisional until the brand team answers #3449: mittwald-lilac.600 equals
# mittwald-lilac.400, mittwald-blue.1100–1900 break the dark mixing rule, and
# the alpha steps skip 32 %. The brand's Info ramp duplicates mittwald-navy
# and is left out; Semantic info references mittwald-navy.
