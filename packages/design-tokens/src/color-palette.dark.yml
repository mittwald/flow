    neutral-base:
      value: "#141516"
    neutral-default:
      value: "#000000"
    neutral-secondary:
      value: "rgb(255 255 255 / 8%)"
    text-primary:
      value: "rgb(255 255 255 / 64%)"
    text-highlight:
      value: "#FFFFFF"

  # Brand 100 tones as surfaces for text. Green and lilac are brand 100 moved
  # towards neutral base (22 % / 24 %), so text-primary and links keep 4.5:1.
  brand-surface:
    blue:
      value: "{color.brand.blue.100}"
    navy:
      value: "{color.brand.navy.100}"
    green:
      value: "#3E4443"
    lilac:
      value: "#483C5D"

  # mittwald "Abstract Gradient": brand light glowing up from a dark ground,
  # see https://branding.mittwald.de/bildwelt.html
  gradient:
    value:
      "radial-gradient(ellipse at 20% 110%, #2D23E859, transparent 55%),
      radial-gradient(ellipse at 85% 105%, #C194FF1F, transparent 45%),
      radial-gradient(ellipse at 55% 120%, #E7A1871A, transparent 40%),
      linear-gradient(180deg, #000000 0%, {color.brand.neutral-base} 100%)"

  background-gradient:
    value: "{color.brand.neutral-base}"
