# Corner radius by role, not by size. A nested element sits at least one
# step below its container (card 24 > table 16 > button 8 > kbd 4).
#   xl     surfaces: LayoutCard, Modal
#   l      content containers that group content: Table, List, AccentBox,
#          Alert, Message, Notification, FileCard, Accordion, CodeBlock,
#          Popover, …
#   m      controls: Button, form fields, MenuItem, Tooltip
#   s      details inside an element: Kbd, InlineCode, list checkbox
#   round  highlighted elements: Avatar, Switch, Slider handle
corner-radius:
  s:
    value: "{size-px.xs}"
  m:
    value: "{size-px.s}"
  l:
    value: "{size-px.m}"
  xl:
    value: "{size-px.l}"
  round:
    value: 50%
border-width:
  50:
    value: 0.5px
  100:
    value: "{size-px.xxxs}"
  200:
    value: "{size-px.xxs}"
  300:
    value: "{size-px.xs}"
  400:
    value: "{size-px.s}"
border-style:
  default:
    value: "solid"
  dashed:
    value: "dashed"
